
name: Build Bingo plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Bingo-Paper-1.21.1
          path: target/Bingo-1.0.0.jar

